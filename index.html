<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="shortcut icon" href="./images_ex5/images/logo-be01d065.png" type="image/x-icon">

    <title>ex5</title>

</head>

<body>

    <section id="Register">
        <div class="container ">
            <div class="head mb-5 text-center">
                <img src="./images_ex5/images/logo-be01d065.png" alt="logo">
            </div>
            <div class="body">
                <form action="" class=" m-auto py-3 px-4 rounded-4" data-type="add">
                    <h3 class="mb-3 text-center">Students System</h3>
                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="First Name *" name="firstName"
                            onblur="checkInput(this)" data-valid="false">

                    </div>
                    <p class="alert alert-danger d-none" data-error-name="firstName" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Last Name *" name="lastName"
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="lastName" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Email *" name="email"
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="email" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-hashtag"></i>
                        </span>
                        <input type="text" class="form-control" name="age" placeholder="Age *"
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="age" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-mobile-button"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Phone *" name="phone"
                            onblur="checkInput(this)" data-valid="false">


                    </div>
                    <p class="alert alert-danger d-none" data-error-name="phone" role="alert"></p>
                    <button class="btn btn-success w-100">Add</button>

                </form>

            </div>
        </div>
    </section>

    <section id="Search" class="my-5 mx-auto w-25">
        <div class="input-group mb-3 ">
            <span class="input-group-text">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" class="form-control" name="Search" id="SearchInput" placeholder="Search...">
        </div>
    </section>

    <section id="Data" class="w-75 m-auto mb-5">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Option</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="TableAlert" class="table-warning text-center" colspan="7 ">There are no data</td>
                    </tr>

                </tbody>
            </table>
        </div>
    </section>

    <script src="./js/bootstrap.js"></script>
    <script src="./js/function.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
